      <stop offset="0" stop-color="#eef7f8"/>
      <stop offset="1" stop-color="#f4f7fb"/>
    </linearGradient>
    <linearGradient id="nav" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#102f43"/>
      <stop offset="1" stop-color="#0b2537"/>
