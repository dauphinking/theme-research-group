<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">自来水与污水全厂 AI 闭环技术架构</title>
  <desc id="desc">从工业现场数据、时序大模型、模型预测控制到控制执行和运行目标的完整闭环架构，并包含设备预测性维护。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5fafb"/><stop offset="1" stop-color="#f7f8fc"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f9f9c"/><stop offset="1" stop-color="#087b91"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#15384b" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#6c98a7"/></marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#0b9b9a"/></marker>
    <style>
      text{font-family:"Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#163247}.title{font-size:36px;font-weight:800}.sub{font-size:18px;fill:#6c8190}.stage{font-size:19px;font-weight:750;fill:#587482;letter-spacing:1px}.head{font-size:24px;font-weight:750}.body{font-size:18px;fill:#5d7280}.small{font-size:16px;fill:#6d8190}.white{fill:#fff}.white-muted{fill:#d7eef1}.pill{font-size:16px;font-weight:700}.node{font-size:18px;font-weight:650}.outcome{font-size:20px;font-weight:750}
    </style>
  </defs>
  <rect width="1600" height="820" rx="28" fill="url(#bg)"/>
  <circle cx="1452" cy="66" r="132" fill="#dff2ef" opacity=".75"/><circle cx="118" cy="768" r="120" fill="#e5edf8" opacity=".8"/>
  <text x="76" y="78" class="title">自来水与污水全厂 AI 闭环技术架构</text>
  <text x="76" y="112" class="sub">时序预测、复杂流程优化控制与关键设备健康管理统一运行</text>
  <rect x="1250" y="54" width="134" height="38" rx="19" fill="#e4f7f4"/><text x="1274" y="80" fill="#137e72" class="pill">安全联锁保留</text>
  <rect x="1396" y="54" width="128" height="38" rx="19" fill="#e9eff9"/><text x="1420" y="80" fill="#466d9f" class="pill">边缘闭环运行</text>

  <text x="76" y="166" class="stage">01  现场感知</text><text x="365" y="166" class="stage">02  预测与软测量</text><text x="678" y="166" class="stage">03  决策与优化</text><text x="1000" y="166" class="stage">04  控制执行</text><text x="1300" y="166" class="stage">05  运行目标</text>

  <!-- Field data -->
  <g filter="url(#shadow)"><rect x="70" y="190" width="250" height="395" rx="22" fill="#fff"/></g>
  <rect x="92" y="214" width="206" height="56" rx="14" fill="#e8f7f6"/><circle cx="119" cy="242" r="14" fill="#13a89f"/><path d="M112 244c4-11 11-14 17-7-2 10-7 16-17 15 4-3 6-6 7-9-3 3-5 4-7 1z" fill="#fff"/><text x="143" y="249" class="head" font-size="21">自来水厂</text>
  <text x="102" y="306" class="node">流量 · 压力 · 液位</text><text x="102" y="338" class="node">浊度 · 余氯 · pH</text><text x="102" y="370" class="node">药耗 · 电耗 · 泵况</text>
  <line x1="98" y1="397" x2="292" y2="397" stroke="#dce8eb"/>
  <rect x="92" y="420" width="206" height="56" rx="14" fill="#eef2fb"/><circle cx="119" cy="448" r="14" fill="#527bd0"/><circle cx="114" cy="452" r="4" fill="#fff"/><circle cx="124" cy="443" r="5" fill="#fff"/><circle cx="126" cy="457" r="3" fill="#fff"/><text x="143" y="455" class="head" font-size="21">污水处理厂</text>
  <text x="102" y="512" class="node">COD · 氨氮 · 总氮</text><text x="102" y="544" class="node">DO · 污泥 · 负荷</text><text x="102" y="576" class="node">振动 · 温度 · 电流</text>

  <!-- Prediction -->
  <g filter="url(#shadow)"><rect x="360" y="190" width="270" height="395" rx="22" fill="#fff"/></g>
  <rect x="382" y="214" width="226" height="70" rx="16" fill="url(#core)"/><text x="403" y="245" class="white head" font-size="22">时序基础大模型</text><text x="403" y="268" class="white-muted" font-size="15">Time-Series Foundation Model</text>
  <rect x="382" y="308" width="226" height="58" rx="13" fill="#edf8f7"/><text x="405" y="343" class="node">多尺度水质与负荷预测</text>
  <rect x="382" y="382" width="226" height="58" rx="13" fill="#eff3fb"/><text x="405" y="417" class="node">关键指标工艺软测量</text>
  <rect x="382" y="456" width="226" height="58" rx="13" fill="#f5f1fb"/><text x="405" y="491" class="node">异常识别与工况迁移</text>
  <text x="395" y="553" class="small">在线更新 · 不确定性区间 · 多步预测</text>

  <!-- Decision -->
  <g filter="url(#shadow)"><rect x="670" y="190" width="280" height="395" rx="22" fill="#0d3448"/></g>
  <text x="698" y="232" class="white head">全厂协同决策核心</text><text x="698" y="260" class="white-muted" font-size="16">多时间尺度、多目标、强约束</text>
  <rect x="696" y="294" width="228" height="68" rx="15" fill="#174b5d"/><circle cx="722" cy="328" r="13" fill="#32c1b4"/><text x="747" y="323" class="white node">模型预测控制 MPC</text><text x="747" y="346" class="white-muted" font-size="14">约束跟踪 · 前馈反馈</text>
  <rect x="696" y="380" width="228" height="68" rx="15" fill="#174b5d"/><circle cx="722" cy="414" r="13" fill="#65a2ea"/><text x="747" y="409" class="white node">实时优化 RTO</text><text x="747" y="432" class="white-muted" font-size="14">能耗 · 药耗 · 产能</text>
  <rect x="696" y="466" width="228" height="68" rx="15" fill="#174b5d"/><circle cx="722" cy="500" r="13" fill="#ac8ae0"/><text x="747" y="495" class="white node">策略评价与自学习</text><text x="747" y="518" class="white-muted" font-size="14">效果对比 · 模型迭代</text>

  <!-- Execution -->
  <g filter="url(#shadow)"><rect x="990" y="190" width="260" height="395" rx="22" fill="#fff"/></g>
  <text x="1016" y="232" class="head">多流程控制对象</text><text x="1016" y="260" class="small">PLC / DCS / SCADA / OPC UA</text>
  <rect x="1016" y="294" width="208" height="48" rx="12" fill="#e8f7f6"/><circle cx="1040" cy="318" r="8" fill="#17aaa1"/><text x="1058" y="325" class="node">混凝、消毒与精准加药</text>
  <rect x="1016" y="356" width="208" height="48" rx="12" fill="#eef3fb"/><circle cx="1040" cy="380" r="8" fill="#527bd0"/><text x="1058" y="387" class="node">曝气、回流与排泥</text>
  <rect x="1016" y="418" width="208" height="48" rx="12" fill="#f4f0fb"/><circle cx="1040" cy="442" r="8" fill="#8a6ed1"/><text x="1058" y="449" class="node">泵组群控与压力调度</text>
  <rect x="1016" y="480" width="208" height="48" rx="12" fill="#fff4e8"/><circle cx="1040" cy="504" r="8" fill="#e99b42"/><text x="1058" y="511" class="node">过滤、深度处理与储水</text>
  <text x="1024" y="559" class="small">人工/自动切换 · 权限分级 · 审计追溯</text>

  <!-- Outcomes -->
  <g filter="url(#shadow)"><rect x="1290" y="190" width="240" height="395" rx="22" fill="#fff"/></g>
  <circle cx="1330" cy="242" r="21" fill="#e7f7ef"/><path d="M1320 242l8 8 15-19" fill="none" stroke="#39b681" stroke-width="4" stroke-linecap="round"/><text x="1362" y="249" class="outcome">水质稳定达标</text>
  <circle cx="1330" cy="326" r="21" fill="#eaf2fc"/><path d="M1319 332l7-12 7 7 9-16" fill="none" stroke="#4f80cf" stroke-width="4"/><text x="1362" y="333" class="outcome">能耗持续降低</text>
  <circle cx="1330" cy="410" r="21" fill="#f2effa"/><path d="M1320 416h20v-22h-20zm5-29h10v7" fill="none" stroke="#876acb" stroke-width="3"/><text x="1362" y="417" class="outcome">药耗精细优化</text>
  <circle cx="1330" cy="494" r="21" fill="#fff3e7"/><path d="M1330 481v13l9 6m-18 3a16 16 0 1 1 6 6" fill="none" stroke="#e49338" stroke-width="3"/><text x="1362" y="501" class="outcome">运行韧性提升</text>
  <text x="1310" y="550" class="small">兼顾产量、成本、设备寿命</text>

  <!-- Main arrows -->
  <path d="M320 386h35" fill="none" stroke="#6c98a7" stroke-width="4" marker-end="url(#arrow)"/><path d="M630 386h35" fill="none" stroke="#6c98a7" stroke-width="4" marker-end="url(#arrow)"/><path d="M950 386h35" fill="none" stroke="#6c98a7" stroke-width="4" marker-end="url(#arrow)"/><path d="M1250 386h35" fill="none" stroke="#6c98a7" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- PHM rail -->
  <g filter="url(#shadow)"><rect x="220" y="636" width="1160" height="116" rx="24" fill="#fff"/></g>
  <rect x="244" y="658" width="190" height="70" rx="17" fill="#f3effb"/><circle cx="278" cy="693" r="17" fill="#8a6ed1"/><path d="M270 693l6 6 11-14" fill="none" stroke="#fff" stroke-width="3"/><text x="307" y="688" class="head" font-size="21">BD-PHM</text><text x="307" y="713" class="small">设备健康管理</text>
  <text x="474" y="681" class="node">状态监测</text><text x="474" y="711" class="small">振动 · 温度 · 电流</text>
  <path d="M616 694h60" stroke="#8f9faa" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="704" y="681" class="node">故障风险预测</text><text x="704" y="711" class="small">退化识别 · 剩余寿命</text>
  <path d="M888 694h60" stroke="#8f9faa" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="977" y="681" class="node">维护决策</text><text x="977" y="711" class="small">预警 · 检修窗口建议</text>
  <path d="M1146 694h58" stroke="#8f9faa" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1232" y="681" class="node">控制协同</text><text x="1232" y="711" class="small">降载 · 切换 · 优化</text>
  <path d="M1304 636v-25H826v-22" fill="none" stroke="#0b9b9a" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrowTeal)"/>
  <path d="M522 636v-25H195v-22" fill="none" stroke="#0b9b9a" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrowTeal)"/>
</svg>
